# FairyReport 简体中文语言文件
#
# 颜色代码用 & 书写，也支持 <#RRGGBB>、<gradient:#色1:#色2>、<red> 等 MiniMessage 写法。
# {xxx} 是占位符，会被替换为实际内容，请不要改动占位符名称。
# 消息前缀由 config.yml 的 prefix 控制，此文件中的文案不需要再写前缀。

